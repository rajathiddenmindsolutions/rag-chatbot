line-length = 100
target-version = "py311"

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "C4",  # comprehensions
    "SIM", # simplify
]
ignore = ["E501"]  # line length handled by formatter

[lint.isort]
known-first-party = ["ragchat"]

[format]
quote-style = "double"
indent-style = "space"
