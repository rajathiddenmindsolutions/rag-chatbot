[project]
name = "ragchat"
version = "0.1.0"
description = "RAG chatbot: Docling + Postgres + OpenSearch hybrid search + Groq + Langfuse"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "docling>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "gradio>=4.44.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.0",
    "opensearch-py==2.4.0",
    "sentence-transformers>=3.0.0",
    "groq>=0.11.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-groq>=0.2.0",
    "langgraph>=0.2.0",
    "langfuse>=2.50.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "jinja2>=3.1.0",
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "tiktoken>=0.13.0",
    "langchain-google-genai>=4.3.1",
    "aiohttp>=3.14.3",
    "langchain-text-splitters>=1.1.2",
    "qdrant-client>=1.18.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "pre-commit>=3.8.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.11.0",
    "httpx>=0.27.0",
    "langchain-experimental>=0.3.0",  # SemanticChunker, used only in chunking evaluator comparisons
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragchat"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
